name: LifeHub
options:
  bundleIdPrefix: app.startupagile
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en
  xcodeVersion: "26.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    CODE_SIGN_STYLE: Automatic
    # Set your Apple Developer Team ID here (or in Xcode's Signing & Capabilities tab):
    # DEVELOPMENT_TEAM: XXXXXXXXXX

targets:
  LifeHub:
    type: application
    platform: iOS
    sources:
      - path: LifeHub
      - path: Shared
    entitlements:
      path: LifeHub/LifeHub.entitlements
      properties:
        com.apple.security.application-groups:
          - group.app.startupagile.lifehub
    info:
      path: LifeHub/Info.plist
      properties:
        CFBundleDisplayName: LifeHub
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSFaceIDUsageDescription: LifeHub uses Face ID to unlock your private data quickly instead of typing your PIN.
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: false
        ITSAppUsesNonExemptEncryption: false
        CFBundleLocalizations:
          - en
          - am
    dependencies:
      - target: LifeHubWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.startupagile.lifehub
        INFOPLIST_KEY_UIUserInterfaceStyle: Automatic

  LifeHubWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: Shared
    entitlements:
      path: Widgets/LifeHubWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.app.startupagile.lifehub
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: LifeHub Widgets
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.startupagile.lifehub.widgets

schemes:
  LifeHub:
    build:
      targets:
        LifeHub: all
    run:
      config: Debug
    archive:
      config: Release
